<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="A puzzle game played inside your browser's address bar."
    />
    <title>404 — Not Found</title>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        background: #0d1b2a;
        overflow: hidden;
      }
      body {
        display: grid;
        place-items: center;
      }
      canvas {
        display: block;
        touch-action: none;
      }

      /*
       * Touch controls: two large press-and-hold buttons standing in for
       * the arrow keys. Real keyboards already have that; a phone doesn't.
       * Gated on html.is-touch (set in main.ts only after a REAL touch
       * event fires) rather than a `pointer: coarse` media query — some
       * hybrid touchscreen laptops report coarse pointers even when a
       * mouse is the actual primary input, which would otherwise leave
       * phantom movement buttons floating over a desktop's game.
       */
      #touch-controls {
        display: none;
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 5;
        justify-content: space-between;
        padding: 0 1.25rem calc(1.25rem + env(safe-area-inset-bottom, 0px));
        pointer-events: none;
      }
      .touch-btn {
        pointer-events: auto;
        width: 4.4rem;
        height: 4.4rem;
        border-radius: 999px;
        border: 1.5px solid #8a6520;
        background: rgba(255, 183, 3, 0.08);
        color: #ffb703;
        font-size: 1.7rem;
        display: grid;
        place-items: center;
        touch-action: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      .touch-btn:active {
        background: rgba(255, 183, 3, 0.24);
      }

      /* Real, tappable equivalents of the R / Esc keycaps drawn on the
         results screen — those are canvas pixels, not buttons, and mean
         nothing to a phone with no keyboard. Desktop already has R / Esc;
         these only appear for a genuinely touch-detected player (see
         html.is-touch in main.ts), not just anyone with a mouse. */
      #found-controls {
        display: none;
        position: fixed;
        left: 50%;
        bottom: calc(2.5rem + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%);
        z-index: 6;
        gap: 0.8rem;
      }
      html.is-touch #found-controls.visible {
        display: flex;
      }
      .found-btn {
        appearance: none;
        font: 700 12px/1 ui-monospace, "JetBrains Mono", "DejaVu Sans Mono", monospace;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #ffb703;
        background: rgba(255, 183, 3, 0.06);
        border: 1.5px solid #ffb703;
        border-radius: 3px;
        padding: 0.65rem 1.3rem;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .found-btn:active {
        background: rgba(255, 183, 3, 0.24);
      }
      .found-btn.secondary {
        color: #8a6520;
        border-color: #8a6520;
        background: transparent;
      }

      /* A gentle nudge, not a blocker: this game is a 960x540 canvas, and
         portrait phones render it tiny with room to spare below it. */
      #rotate-hint {
        display: none;
        position: fixed;
        top: env(safe-area-inset-top, 0.75rem);
        left: 50%;
        transform: translateX(-50%);
        z-index: 6;
        color: #8a6520;
        font: 400 0.72rem/1.4 ui-monospace, "DejaVu Sans Mono", monospace;
        letter-spacing: 1px;
        text-align: center;
        pointer-events: none;
      }

      html.is-touch #touch-controls.active {
        display: flex;
      }
      @media (pointer: coarse) and (orientation: portrait) {
        #rotate-hint {
          display: block;
        }
      }

      /*
       * The rules of this game are unlike almost any other web game: the
       * browser's own address bar and Back button are the controller. That
       * is the entire point, but it means a first-time player who is not
       * told this upfront has no way to guess it. This overlay says the
       * rules once, plainly, before anything else happens.
       */
      #intro {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: rgba(13, 27, 42, 0.94);
        color: #ffb703;
        font: 400 0.95rem/1.7 ui-monospace, "JetBrains Mono", "DejaVu Sans Mono",
          "Courier New", monospace;
        text-align: left;
        cursor: pointer;
        transition: opacity 0.25s ease;
      }
      #intro.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
      #intro .card {
        max-width: 26rem;
        border: 1px solid #8a6520;
        padding: 2rem 2.25rem;
        text-align: center;
      }
      #intro .title {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: 6px;
        margin-bottom: 0.6rem;
      }
      #intro .lede {
        color: #cda659;
        font-size: 0.85rem;
        letter-spacing: 0.5px;
        margin-bottom: 1.6rem;
      }
      #intro .howto {
        display: flex;
        flex-direction: column;
        gap: 0.65rem;
        margin-bottom: 2rem;
        text-align: left;
      }
      #intro .howto-row {
        display: flex;
        align-items: center;
        gap: 0.7rem;
        font-size: 0.8rem;
        color: #ffb703;
      }
      #intro .keys {
        display: flex;
        gap: 0.3rem;
        flex: 0 0 auto;
        width: 4.6rem;
        justify-content: flex-start;
      }
      #intro .keycap {
        display: inline-grid;
        place-items: center;
        min-width: 1.7rem;
        height: 1.7rem;
        padding: 0 0.3rem;
        border: 1px solid #8a6520;
        border-radius: 3px;
        font-size: 0.7rem;
        font-weight: 700;
        color: #ffd166;
      }
      #intro .only-coarse {
        display: none;
      }
      @media (pointer: coarse) {
        #intro .only-fine {
          display: none;
        }
        #intro .only-coarse {
          display: flex;
        }
      }
      #intro .start-btn {
        font: inherit;
        font-size: 0.9rem;
        font-weight: 700;
        letter-spacing: 4px;
        color: #ffb703;
        background: transparent;
        border: 1px solid #ffb703;
        padding: 0.75rem 2.6rem;
        cursor: pointer;
        animation: intro-pulse 1.8s ease-in-out infinite;
        transition:
          background 0.15s ease,
          color 0.15s ease;
      }
      #intro .start-btn:hover,
      #intro .start-btn:focus-visible {
        background: #ffb703;
        color: #0d1b2a;
        animation: none;
        outline: none;
      }
      @keyframes intro-pulse {
        0%,
        100% {
          opacity: 0.6;
        }
        50% {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="intro">
      <div class="card">
        <p class="title">404</p>
        <p class="lede">a puzzle played in your address bar</p>
        <div class="howto">
          <div class="howto-row only-fine">
            <span class="keys"><span class="keycap">A</span><span class="keycap">D</span></span>
            <span>move &mdash; arrows work too</span>
          </div>
          <div class="howto-row only-coarse">
            <span class="keys"><span class="keycap">&larr;</span><span class="keycap">&rarr;</span></span>
            <span>move &mdash; press and hold</span>
          </div>
          <div class="howto-row">
            <span class="keys"><span class="keycap">URL</span></span>
            <span>edit it to solve each room</span>
          </div>
          <div class="howto-row">
            <span class="keys"><span class="keycap">BACK</span></span>
            <span>rewinds time</span>
          </div>
        </div>
        <button type="button" class="start-btn">start</button>
      </div>
    </div>
    <p id="rotate-hint">rotate your phone &mdash; this plays better sideways</p>

    <div id="touch-controls">
      <button type="button" class="touch-btn" id="touch-left" aria-label="Move left">&larr;</button>
      <button type="button" class="touch-btn" id="touch-right" aria-label="Move right">&rarr;</button>
    </div>

    <div id="found-controls">
      <button type="button" class="found-btn" id="replay-btn">Play again</button>
      <button type="button" class="found-btn secondary" id="menu-btn">Menu</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
