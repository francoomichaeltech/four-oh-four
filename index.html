<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="A puzzle game played inside your browser's address bar."
    />
    <title>404 — Not Found</title>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        background: #0d1b2a;
        overflow: hidden;
      }
      body {
        display: grid;
        place-items: center;
      }
      canvas {
        display: block;
        touch-action: none;
      }
      #no-keyboard {
        display: none;
        padding: 2rem;
        max-width: 32rem;
        text-align: center;
        color: #ffb703;
        font: 400 0.95rem/1.9 ui-monospace, "DejaVu Sans Mono", monospace;
      }
      /* This game is played by typing into the address bar.
         Touch devices cannot do that, so we say so honestly. */
      @media (pointer: coarse) {
        canvas {
          display: none;
        }
        #no-keyboard {
          display: block;
        }
        #intro {
          display: none;
        }
      }

      /*
       * The rules of this game are unlike almost any other web game: the
       * browser's own address bar and Back button are the controller. That
       * is the entire point, but it means a first-time player who is not
       * told this upfront has no way to guess it. This overlay says the
       * rules once, plainly, before anything else happens.
       */
      #intro {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: rgba(13, 27, 42, 0.94);
        color: #ffb703;
        font: 400 0.95rem/1.7 ui-monospace, "JetBrains Mono", "DejaVu Sans Mono",
          "Courier New", monospace;
        text-align: left;
        cursor: pointer;
        transition: opacity 0.25s ease;
      }
      #intro.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
      #intro .card {
        max-width: 26rem;
        border: 1px solid #8a6520;
        padding: 2rem 2.25rem;
        text-align: center;
      }
      #intro .title {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: 6px;
        margin-bottom: 0.6rem;
      }
      #intro .lede {
        color: #cda659;
        font-size: 0.85rem;
        letter-spacing: 0.5px;
        margin-bottom: 1.6rem;
      }
      #intro .controls {
        display: flex;
        justify-content: center;
        gap: 2.2rem;
        margin-bottom: 1.8rem;
      }
      #intro .control {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
      }
      #intro .glyph {
        font-size: 1.3rem;
        border: 1px solid #8a6520;
        border-radius: 4px;
        width: 2.4rem;
        height: 2.4rem;
        display: grid;
        place-items: center;
      }
      #intro .control span:last-child {
        font-size: 0.68rem;
        color: #8a6520;
        letter-spacing: 1px;
      }
      #intro .start {
        color: #8a6520;
        letter-spacing: 2px;
        font-size: 0.78rem;
        animation: intro-pulse 1.6s ease-in-out infinite;
      }
      @keyframes intro-pulse {
        0%,
        100% {
          opacity: 0.5;
        }
        50% {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="intro">
      <div class="card">
        <p class="title">404</p>
        <p class="lede">a puzzle played in your address bar</p>
        <div class="controls">
          <div class="control">
            <span class="glyph">&larr;&rarr;</span>
            <span>move</span>
          </div>
          <div class="control">
            <span class="glyph">&#9679;</span>
            <span>start</span>
          </div>
          <div class="control">
            <span class="glyph">&#8630;</span>
            <span>rewind</span>
          </div>
        </div>
        <p class="start">click to begin</p>
      </div>
    </div>
    <p id="no-keyboard">
      404<br /><br />
      this game is played in the address bar.<br />
      it needs a keyboard.<br /><br />
      please open it on a desktop browser.
    </p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
